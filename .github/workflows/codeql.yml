name: CodeQL Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 4 * * 3"
  workflow_dispatch:

# CodeQL needs to upload only security findings. It cannot alter repository content.
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Python and workflow configuration
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: python, actions
          build-mode: none

      - name: Analyze code and workflow configuration
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          category: "/language:python-and-actions"
