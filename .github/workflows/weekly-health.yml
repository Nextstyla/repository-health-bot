name: Weekly Repository Health
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health-report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes --requirement requirements.tools.txt
      - run: |
          mkdir -p artifacts
          python -m repository_health_bot . --audit --json-output artifacts/weekly-health.json > artifacts/weekly-health.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: weekly-repository-health-${{ github.sha }}
          path: artifacts/
          retention-days: 14
