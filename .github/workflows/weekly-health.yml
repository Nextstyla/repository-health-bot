name: Weekly Repository Health
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health-report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes --requirement requirements.tools.txt
      - run: |
          mkdir -p artifacts
          python -m repository_health_bot . --audit --json-output artifacts/weekly-health.json > artifacts/weekly-health.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weekly-repository-health-${{ github.sha }}
          path: artifacts/
          retention-days: 14
