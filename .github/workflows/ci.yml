name: Repository Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes --requirement requirements.tools.txt
      - run: ruff format --check .
      - run: ruff check .
      - run: python -m unittest discover --verbose
      - run: python -m pip_audit --requirement requirements.tools.txt --require-hashes
      - run: |
          mkdir -p artifacts
          python -m repository_health_bot . --audit --json-output artifacts/health-report.json > artifacts/health-report.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repository-health-report-${{ github.sha }}
          path: artifacts/
          retention-days: 14
